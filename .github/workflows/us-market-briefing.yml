name: US Market Kakao Briefing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "market_briefing_bot/**"
      - "tests/**"
      - ".github/workflows/us-market-briefing.yml"
  schedule:
    # Start at 08:55 KST Tuesday-Saturday, away from GitHub's busy top-of-hour queue.
    # The delivery gate below holds the Kakao message until 09:00 KST.
    - cron: "55 23 * * 1-5"

concurrency:
  group: us-market-kakao-briefing
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REDIRECT_URI: http://localhost:8765/callback
      KAKAO_LINK_URL: https://finance.yahoo.com/markets
      KAKAO_TOKENS_JSON: ${{ secrets.KAKAO_TOKENS_JSON }}
      KAKAO_SEND_MODE: link
      REPORT_PUBLIC_BASE_URL: https://magirl2.github.io/news-2/reports
      REPORT_TIMEZONE: Asia/Seoul
      MARKET_TIMEZONE: America/New_York
      WATCHLIST_SYMBOLS: ${{ secrets.WATCHLIST_SYMBOLS }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check readiness
        run: python -m market_briefing_bot readiness

      - name: Load previous signal history
        run: |
          mkdir -p reports
          curl -fsSL https://magirl2.github.io/news-2/reports/signals/latest.json -o reports/previous_signals.json || true

      - name: Preserve previous published report
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          base = "https://magirl2.github.io/news-2"
          reports = Path("reports")
          reports.mkdir(exist_ok=True)
          names = set()
          manifest_loaded = False
          try:
              manifest = json.loads(
                  urllib.request.urlopen(base + "/reports/index.json", timeout=10)
                  .read()
                  .decode("utf-8")
              )
              for item in manifest.get("reports", []):
                  names.update((item.get("html", ""), item.get("markdown", "")))
              names.discard("")
              manifest_loaded = bool(names)
          except Exception:
              pass

          try:
              index = urllib.request.urlopen(base + "/", timeout=10).read().decode("utf-8", "ignore")
          except Exception:
              index = ""

          names.update(
              re.findall(r"reports/([0-9]{4}-[0-9]{2}-[0-9]{2}_briefing\.(?:html|md))", index)
          )

          # One-time migration from the old latest-only page: probe recent predictable URLs.
          if not manifest_loaded:
              today_kst = (datetime.now(timezone.utc) + timedelta(hours=9)).date()
              for offset in range(21):
                  day = today_kst - timedelta(days=offset)
                  stem = f"{day.isoformat()}_briefing"
                  names.update((stem + ".html", stem + ".md"))

          for name in sorted(names):
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}_briefing\.(?:html|md)", name):
                  continue
              try:
                  urllib.request.urlretrieve(f"{base}/reports/{name}", reports / name)
              except Exception:
                  pass
          PY

      - name: Build report
        run: python -m market_briefing_bot preview

      - name: Prepare Pages report
        run: python -m market_briefing_bot build-site --source reports --output site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Hold scheduled delivery until 09:00 KST
        if: github.event_name == 'schedule'
        run: >
          python -m market_briefing_bot wait-until
          --time 09:00
          --timezone Asia/Seoul
          --max-wait-seconds 900

      - name: Send Kakao briefing
        if: github.event_name != 'push'
        run: python -m market_briefing_bot send-built

      - name: Notify Kakao on failure
        if: failure() && github.event_name != 'push'
        continue-on-error: true
        run: >
          python -m market_briefing_bot notify-failure
          --location "GitHub Actions: send-briefing"
          --error "미국장 브리핑 workflow 중 한 단계가 실패했습니다. 실패한 단계는 이 실행 로그에서 빨간 표시를 확인해 주세요."
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --rerun-hint "위 로그 링크를 열고 오른쪽 위 Re-run jobs를 누르세요."

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-briefing-reports
          path: |
            reports/*.md
            reports/*.html
            logs/*.log
          if-no-files-found: ignore
